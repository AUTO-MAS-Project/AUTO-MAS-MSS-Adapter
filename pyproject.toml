[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-mss-adapter"
version = "0.1.0"
description = "MSS (MaaStellaSora) specialized script adapter for AUTO-MAS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = [
  "auto-mas-plugin",
  "auto-mas-id:mss_adapter",
]
# 0.1.0 直接 import 三块积木插件的模块（越界清单见 README），所以对积木也写次版本上限。
dependencies = [
  "auto-mas-core>=5.9.0b1,<6",
  "auto-mas-maafw-interface>=0.1.0,<0.2",
  "auto-mas-maafw-native>=0.1.0,<0.2",
  "auto-mas-maafw-agent-env>=0.1.0,<0.2",
  "auto-mas-maafw-runner>=0.1.0,<0.2",
  "auto-mas-maafw-project-update>=0.1.0,<0.2",
]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter/blob/master/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter/blob/master/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mss_adapter = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["mss_adapter"]
known-third-party = ["app", "auto_mas_core", "maafw_interface", "maafw_native", "maafw_agent_env", "maafw_runner", "maafw_project_update"]
