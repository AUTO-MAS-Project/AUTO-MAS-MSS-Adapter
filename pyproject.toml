[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-mss-adapter"
version = "0.3.2"
description = "MSS (MaaStellaSora) specialized script adapter for AUTO-MAS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = [
  "auto-mas-plugin",
  "auto-mas-id:mss_adapter",
]
# 直接导入两块库与专项共用库，写次版本上限；三块服务插件（agent 环境、运行、项目更新）只经服务调用、不导入它们的模块，只写下限。
# 托管生命周期钩子、按配置判定游戏类型与桌面分身要宿主带 SDK 三组出口；这几项出口没有单独抬 SDK 的版本号
# （仍是 5.9.0b1），下限写不出区别，插件导入时按 ScriptAdapterPlugin / ScriptTypeDecl 上有没有这些出口检查。
dependencies = [
  "auto-mas-core>=5.9.0b1,<6",
  "auto-mas-maafw-interface>=0.3.1,<0.4",
  "auto-mas-maafw-native>=0.3.0,<0.4",
  "auto-mas-maafw-agent-env>=0.3.0",
  "auto-mas-maafw-runner>=0.3.0",
  "auto-mas-maafw-project-update>=0.3.0",
  "auto-mas-maafw-adapter-kit>=0.3.1,<0.4",
]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter/blob/master/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter/blob/master/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MSS-Adapter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mss_adapter = ["py.typed", "ui/*.json", "ui/*.html", "ui/assets/*", "i18n/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["mss_adapter"]
known-third-party = ["app", "auto_mas_core", "maafw_interface", "maafw_native", "maafw_agent_env", "maafw_runner", "maafw_project_update", "maafw_adapter_kit"]
